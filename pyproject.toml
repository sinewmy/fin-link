[project]
name = "finlink"
version = "0.1.0"
description = "Markdown-first investment decision journal: thesis, evidence, validation, review."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "tabulate>=0.9",
    "openai>=3.8.0",
    "yfinance>=1.7.0",
    "feedparser>=6.0.14",
]

# Optional: romanises Chinese ticker reasons into readable slugs
# (kan-hao-teng-xun instead of cjk-770b597d817e). finlink runs fine without it.
[project.optional-dependencies]
pinyin = ["pypinyin>=0.50"]

[project.scripts]
finlink = "finlink.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finlink"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
